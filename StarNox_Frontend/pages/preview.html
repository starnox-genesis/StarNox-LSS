<div class="page">

    <!-- Top Bar -->
    <div class="top-bar">
        <button class="back-btn" onclick="loadPage('billing')">←</button>
        <div class="title">Review Bill</div>
    </div>

    <!-- Bill Summary -->
    <div class="section">
        <div><strong>Previous Due:</strong> ₹<span id="prevDue"></span></div>
        <div><strong>Current Sale:</strong> ₹<span id="currSale"></span></div>
        <div><strong>Grand Total:</strong> ₹<span id="grandTotal"></span></div>

    </div>

    <!-- Payment -->
    <div class="section">
        <label><b>Amount Received:</b></label>
        <input type="number" oninput="updateReceived(this.value)">
        <label><b>Customer Name :</b></label>
        <input class="NameBox" type="text" oninput="billState.customerName=this.value">


    </div>

    <!-- Remaining Due -->
    <div>
        <b>Remaining Due:</b>
        <span id="remainingDue">₹</span>
    </div>

    <div class="section">
        <button class="primary-btn" onclick="saveBill()">
            Confirm
        </button>

    </div>

</div>
