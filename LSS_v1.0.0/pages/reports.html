<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>

<link rel="stylesheet" href="../css/reports.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2f6fb2">

</head>

<body data-page="reports">

<div class="app">

<div class="header">

<div class="back" onclick="goBack()">←</div>

<div class="title">Reports</div>

<div class="right-icons">
🔔
<div class="profile"></div>
</div>

</div>

<div class="tabs">
<div class="tab active" data-type="today">Today</div>
<div class="tab" data-type="week">Week</div>
<div class="tab" data-type="month">Month</div>
<div class="tab" data-type="year">Year</div>
</div>

<div class="card">

<div class="summary">

<div class="summary-item">
<img src="https://cdn-icons-png.flaticon.com/512/1170/1170678.png">
<div>Total Sale</div>
<h3 id="totalSale">₹0</h3>
</div>

<div class="summary-item">
<img src="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">
<div>Cash</div>
<h3 id="totalCash">₹0</h3>
</div>

<div class="summary-item">
<img src="https://cdn-icons-png.flaticon.com/512/2920/2920264.png">
<div>Due</div>
<h3 id="totalDue">₹0</h3>
</div>

</div>

</div>

<div class="card">

<div class="chart-title">
<div>Sales Trend</div>
<div style="color:#888">Last 7 days</div>
</div>

<canvas id="chart"></canvas>

</div>

<div class="card">

<h3>Top Due Customers</h3>

<div id="topCustomers"></div>

</div>

<div class="footer">
StarNox LSS
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="../js/script.js"></script>
<script type="module" src="../js/modules/reports.js"></script>

</body>
</html>
