<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Bill</title>

    <link rel="stylesheet" href="../css/update-bill.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2f6fb2">
</head>

<body data-page="update-bill">

    <div class="app">

        <!-- Topbar -->
        <div class="topbar">
            <div class="back" onclick="goBack()">←</div>
            Update Bill
        </div>

        <div class="body">

            <!-- Customer -->
            <div class="customer-row">
                <div class="cust-name" id="custName">Name...</div>
                <div class="due-badge">
                    <span id="headerDue"> 0</span>
                </div>
            </div>

            <div class="prev-due">
                Last Update: <span id="prevDueText"></span>
            </div>

            <!-- Inputs -->
            <input id="sale" class="input" placeholder="Sale Amount">
            <input id="received" class="input" placeholder="Amount Received">

            <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
                <input type="checkbox" id="allowAdvance">
                Allow Advance Payment
            </label>

            <!-- Remaining -->
            <div class="due-box">
                <div class="due-label" id="remainLabel"><b>Remaining Due</b></div>
                <div class="due-amount"> <span id="remain">0</span></div>
            </div>

            <button class="btn" onclick="confirmUpdate()">
                Confirm Update
            </button>

            <div id="status" class="status"></div>

        </div>

    </div>

    <script type="module" src="../js/script.js"></script>

</body>

</html>
