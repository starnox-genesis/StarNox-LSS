<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Profile</title>
  <link rel="stylesheet" href="../css/edit-profile.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2f6fb2">
</head>

<body data-page="edit-profile">

  <div class="app">

    <!-- Topbar -->
    <div class="topbar">
      <div class="left">
        <div class="back" onclick="goBack()">←</div>
        Customer Profile
      </div>
    </div>

    <div class="body">
      <form>
        <div class="field">
          <label for="custName" class="label">Customer Name</label>
          <input id="custName" class="input" placeholder="Enter Name" type="text">
        </div>

        <div class="field">
          <label for="mobile" class="label">Mobile Number</label>
          <input id="mobile" class="input" type="tel" maxlength="10" inputmode="numeric" placeholder="Enter Mobile Number">
        </div>

        <div class="field">
          <label for="address" class="label">Address (optional)</label>
          <input id="address" class="input" placeholder="Enter Address" type="text">
        </div>

        <!-- <div class="divider"></div> -->

        <!-- <div class="section-title">Account Summary</div>

        <div class="summary-row">
          <div>Total Sale</div>
          <strong>₹<span id="totalSale">0</span></strong>
        </div>

        <div class="summary-row">
          <div>Total Paid</div>
          <strong>₹<span id="totalPaid">0</span></strong>
        </div>

        <div class="summary-row">
          <div>Current Due</div>
          <strong class="due">₹<span id="currentDue">0</span></strong>
        </div> -->

        <button class="btn btn-primary" type="button" onclick="saveChanges()">
          Save Changes
        </button>

        <button type="button" class="btn btn-danger" onclick="deleteCustomer()">
          Delete Customer
        </button>

        <div id="status" class="status"></div>
      </form>
    </div>

  </div>

  <script type="module" src="../js/script.js"></script>

</body>

</html>
