<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarNox LSS Login</title>

<link rel="stylesheet" href="../css/login.css">
</head>

<body data-page="login">

<div class="app">

  <div class="top">
    <div class="help" onclick="openHelp()">❓ Help</div>
  </div>

  <div class="logo-wrap">
    <div class="logo-main">★ StarNox</div>
    <div class="logo-sub">LSS</div>
  </div>

  <input id="user" class="input" placeholder="Email or Phone">
  <input id="pass" class="input" type="password" placeholder="Password">

  <button class="btn-main" onclick="login()">Sign In</button>

  <div id="status" class="status"></div>

  <div class="social-row">
    <button class="btn-social" onclick="googleLogin()">Google</button>
    <button class="btn-social" onclick="appleLogin()">Apple</button>
  </div>

  <div class="footer">
    Don't have an account? <a href="#" onclick="signup()">Sign up</a>
  </div>

</div>

<script type="module" src="../js/script.js"></script>

</body>
</html>
