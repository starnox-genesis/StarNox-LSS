<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Customer</title>

  <link rel="stylesheet" href="../css/add-customer.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2f6fb2">
</head>

<body data-page="add-customer">

  <div class="app">

    <!-- Top Bar -->
    <div class="topbar">
      <div class="back" onclick="goBack()">←</div>
      Add Customer
    </div>

    <!-- Form -->
    <div class="card">

      <div class="field">
        <input id="name" placeholder=" ">
        <label>Customer Name</label>
      </div>

      <div class="field">
        <input id="mobile" placeholder=" " inputmode="numeric" maxlength="10">
        <label>Mobile Number (Optional)</label>
      </div>

      <div class="field">
        <input id="saleAmount" placeholder=" " inputmode="decimal" oninput="updateSale(this.value)">
        <label>Sale Amount</label>
      </div>

      <div class="field">
        <input id="receivedAmount" placeholder=" " inputmode="decimal" oninput="updateReceived(this.value)">
        <label>Payments</label>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
                <input type="checkbox" id="allowAdvance">
                Allow Advance Payment
            </label>
      <div class="due-box">
        <div class="due-label" id="remainLabel">Remaining Due</div>
        <div class="due-amount"> <span id="remainingDue">0</span></div>
      </div>

      <button class="save-btn" onclick="saveCustomer()">
        Save Customer
      </button>

      <div id="status" class="status"></div>

    </div>

  </div>

  <script type="module" src="../js/script.js"></script>

</body>

</html>
