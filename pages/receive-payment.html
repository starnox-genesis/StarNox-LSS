<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receive Payment</title>

<link rel="stylesheet" href="../css/receive-payment.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2f6fb2">
</head>

<body data-page="receive-payment">

<div class="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="back" onclick="goBack()">←</div>
    Receive Payment
  </div>

  <div class="body">

    <div class="customer-row">
                <div class="cust-name" id="custName">Name...</div>
                <div class="due-badge">
                    <span id="headerDue"> 0</span>
                </div>
            </div>

            <div class="prev-due">
                Last Update: <span id="prevDueText"></span>
            </div>

            <!-- Inputs -->
            <input id="payment" class="input" placeholder="Payment Amount">

            <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
                <input type="checkbox" id="allowAdvance">
                Allow Advance Payment
            </label>

            <!-- Remaining -->
            <div class="due-box">
                <div class="due-label" id="remainLabel"><b>Remaining Due</b></div>
                <div class="due-amount"> <span id="remain">0</span></div>
            </div>

    <!-- Payment Mode -->
    <div class="pm-title">Payment mode</div>

    <div class="pm-row">
      <button class="pm active" onclick="setMode(this,'Cash')">Cash</button>
      <button class="pm" onclick="setMode(this,'UPI')">UPI</button>
      <button class="pm" onclick="setMode(this,'Bank')">Bank</button>
    </div>

    <button class="btn" onclick="confirmPayment()">
      Confirm Payment
    </button>

    <div id="status" class="status"></div>

  </div>

</div>

<script type="module" src="../js/script.js"></script>

</body>
</html>
