<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password</title>

<link rel="stylesheet" href="../css/change-password.css">
</head>

<body data-page="change-password">

<div class="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="back" onclick="goBack()">←</div>
    Change Password
  </div>

  <div class="body">

    <input id="current" class="input" type="password"
           placeholder="Current Password">

    <input id="newp" class="input" type="password"
           placeholder="New Password">

    <input id="conf" class="input" type="password"
           placeholder="Confirm Password">

    <button class="btn" onclick="updatePassword()">
      Update Password
    </button>

    <div id="status" class="status"></div>

  </div>

</div>

<script type="module" src="../js/script.js"></script>

</body>
</html>
